server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mall}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: admin01
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet: #访问监控网页的登录用户名和密码
        login-username: admin01
        login-password: ${DB_PASSWORD:}
  data:
    mongodb:
      host: 100.64.0.2
      port: 27017
      database: mall-port
      # 如果MongoDB需要认证，添加以下配置
      # username: your_mongo_username
      # password: your_mongo_password

  redis:
    host: ${DB_HOST:localhost} # Redis服务器地址
    database: 0 # Redis数据库索引（默认为0）
    port: 6379 # Redis服务器连接端口
    password: ${DB_PASSWORD:} # Redis服务器连接密码（默认为空）
    timeout: 300ms # 连接超时时间（毫秒）
  rabbitmq:
    host: 100.64.0.2
    port: 5672
    virtual-host: /mall
    username: mall
    password: ${NEO4J_PASSWORD:}

  # 邮件发送配置
  mail:
    host: smtp.qq.com # QQ邮箱SMTP服务器，可根据需要修改为其他邮箱服务商
    port: 587
    username: cheng.nuo.song@qq.com # 发送方邮箱地址
    password: ${MAIL_PASSWORD:} # 邮箱授权码（不是登录密码）
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

#  neo4j:
#    uri: neo4j://100.64.0.2:7687
#    authentication:
#      username: neo4j
#      password: admin001

logging:
  level:
    root: info
    com.macro.mall: debug

logstash:
  host: 100.64.0.2
  enableInnerLog: false

alipay:
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  appId: your appId
  alipayPublicKey: your alipayPublicKey
  appPrivateKey: your appPrivateKey
  returnUrl: http://100.64.0.2:8060/#/pages/money/paySuccess
  notifyUrl:
