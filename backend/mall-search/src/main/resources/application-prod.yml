spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mall}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: admin01
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet: #访问监控网页的登录用户名和密码
        login-username: admin01
        login-password: ${DB_PASSWORD:}
  data:
    elasticsearch:
      repositories:
        enabled: true
  elasticsearch:
    # 使用您的局域网IP地址
    uris: 100.64.0.2:9200
    connection-timeout: 10s
    socket-timeout: 30s
  # Redis配置也使用局域网IP
  redis:
    host: ${DB_HOST:localhost}
    port: 6379
    password: ${DB_PASSWORD:}
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

logging:
  level:
    root: info
    com.macro.mall: debug

logstash:
  # 使用局域网IP
  host: 100.64.0.2
  enableInnerLog: false