# FastAPI推荐算法微服务配置示例
# 请将此配置添加到 mall-portal 模块的 application.yml 或 application.properties 中

# FastAPI推荐服务配置
python:
  fastapi:
    service:
      # FastAPI服务地址，默认localhost:8000
      url: http://localhost:8000
      # 连接超时时间（毫秒）
      connect-timeout: 5000
      # 读取超时时间（毫秒）
      read-timeout: 30000
      # 是否启用推荐服务
      enabled: true

# OpenFeign配置
feign:
  client:
    config:
      fastapi-recommendation-service:
        # 连接超时
        connectTimeout: 5000
        # 读取超时
        readTimeout: 30000
        # 日志级别
        loggerLevel: basic
        # 重试配置
        retryer:
          # 重试间隔（毫秒）
          period: 100
          # 最大重试间隔（毫秒）
          maxPeriod: 1000
          # 最大重试次数
          maxAttempts: 3

# 推荐系统业务配置
recommendation:
  # 默认推荐数量
  default-top-k: 10
  # 最大推荐数量
  max-top-k: 50
  # 用户点击强度默认值
  default-click-strength: 0.5
  # 缓存配置
  cache:
    # 动量数据缓存时间（秒）
    momentum-ttl: 3600
    # 推荐结果缓存时间（秒）
    recommendation-ttl: 300
