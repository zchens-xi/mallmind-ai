name: Import project source

on:
  push:
    paths:
      - '.upload/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore upstream baselines
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend admin-web app-web

          git init /tmp/backend
          git -C /tmp/backend remote add origin https://github.com/macrozheng/mall.git
          git -C /tmp/backend fetch --depth=1 origin 54b11fc32d8a8c171f0eae15e914b772a76e42b2
          git -C /tmp/backend checkout --detach FETCH_HEAD
          rm -rf /tmp/backend/.git
          mv /tmp/backend backend

          git init /tmp/admin-web
          git -C /tmp/admin-web remote add origin https://github.com/macrozheng/mall-admin-web.git
          git -C /tmp/admin-web fetch --depth=1 origin 1bba8a3f3960f6ea4eaf4609483ea79e880129af
          git -C /tmp/admin-web checkout --detach FETCH_HEAD
          rm -rf /tmp/admin-web/.git
          mv /tmp/admin-web admin-web

          git init /tmp/app-web
          git -C /tmp/app-web remote add origin https://github.com/macrozheng/mall-app-web.git
          git -C /tmp/app-web fetch --depth=1 origin a5e88c56ef63c7b6df2cfe5c4dd021c9210a4f51
          git -C /tmp/app-web checkout --detach FETCH_HEAD
          rm -rf /tmp/app-web/.git
          mv /tmp/app-web app-web

      - name: Apply course-project overlays
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/chunk-* > /tmp/mall-ai-overlays.b64
          base64 -d /tmp/mall-ai-overlays.b64 > /tmp/mall-ai-overlays.tar.xz
          tar -xJf /tmp/mall-ai-overlays.tar.xz -C .

      - name: Publish source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .payload .upload
          rm -f UPLOAD_STATUS
          rm -f .github/workflows/import-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import mall AI course project source'
          git push origin HEAD:main
